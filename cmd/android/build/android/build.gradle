apply plugin: 'com.android.application'
android {
    namespace = "br.wandendourado.legiao"
    compileSdkVersion 35
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId "br.wandendourado.legiao"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            storeFile file("../legiao.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "legiao"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            zipAlignEnabled true
            signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
dependencies {
}